name: Build and Release Latest

on:
  push:
    branches:
      - master

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      
      - name: Install dependencies
        run: ls && npm ci

      - name: Build extension ZIP
        run: npx wxt zip
